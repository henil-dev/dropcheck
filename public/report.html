<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis · Dropcheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">drop<span>check</span></a>
      <nav class="nav">
        <a href="/">New analysis</a>
        <a href="/history" class="on">History</a>
        <a href="/admin">Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <p class="small" style="margin:0 0 8px"><a href="/history">← All analyses</a></p>
    <h1 id="title">Analysis</h1>
    <p class="lede" id="meta"></p>
    <div id="result"></div>
  </main>

  <script type="module">
    import { renderSavedReport } from '/views.js';
    const id = new URLSearchParams(location.search).get('id');
    renderSavedReport(document.getElementById('result'), id, { titleEl: document.getElementById('title'), metaEl: document.getElementById('meta') });
  </script>
</body>
</html>
